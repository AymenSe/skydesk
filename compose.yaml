name: skydesk

services:
  api:
    build:
      context: .
      target: api
    image: skydesk-api:dev
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PASSWORD_FILE: /run/secrets/db_password
      INTENT_THRESHOLD: ${INTENT_THRESHOLD:-0.45}
      REDIS_URL: redis://redis:6379/0

    secrets:
      - db_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: .
      target: worker
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cu126}
    image: skydesk-worker:dev
    environment:
      DB_HOST: postgres
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_URL: redis://redis:6379/0
      LLM_MODEL_ID: ${LLM_MODEL_ID:-Qwen/Qwen2.5-0.5B-Instruct}
      LLM_DEVICE: cpu
      LLM_DTYPE: ${LLM_DTYPE:-float32}
      LLM_MAX_NEW_TOKENS: ${LLM_MAX_NEW_TOKENS:-200}
    secrets:
      - db_password
    volumes:
      - hf-cache:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "skydesk.worker.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5m
    stop_grace_period: 60s
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: skydesk
      POSTGRES_DB: skydesk
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro     
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skydesk -d skydesk"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  tests:
    build:
      context: .
      target: test
    image: skydesk-tests:dev
    profiles: ["test"]
    volumes:
      - ./skydesk:/app/skydesk
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml

volumes:
  pgdata:
  redisdata:
  hf-cache:

secrets:
  db_password:
    file: ./secrets/db_password.txt